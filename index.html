<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glitch-Core | Development</title>
  <link rel="stylesheet" href="./src/presentation/styles/main.css">
</head>
<body>
  <main>
    <header><p class="eyebrow">GLITCHOUT-CO · DEVELOPMENT BUILD</p><h1>Glitch-Core</h1></header>
    <section aria-labelledby="foundation-title">
      <h2 id="foundation-title">Core foundation</h2>
      <p>Guest session. Character presentation and independent behaviour are not implemented yet.</p>
      <p role="status" id="status">Preparing core controller…</p>
      <div class="controls">
        <button type="button" data-command="start" disabled>Start</button>
        <button type="button" data-command="pause" disabled>Pause</button>
        <button type="button" data-command="resume" disabled>Resume</button>
        <button type="button" data-command="disable" disabled>Disable</button>
      </div>
      <p class="note">These controls test the core lifecycle only. No personal information is stored or sent.</p>
    </section>
    <noscript>JavaScript is required to operate this development build.</noscript>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
